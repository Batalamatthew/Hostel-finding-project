<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelFinder - Register</title>
  

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
   
    body {
      background: linear-gradient(105deg, rgba(28,20,15,0.85), rgba(47,31,16,0.7) 58%, rgba(31,23,14,0.5)),
                  url('WhatsApp Image 2026-11-02 at 21.27.06.jpeg') center/cover no-repeat !important;
      height: 100vh;
      overflow: hidden; 
    }
    .custom-glass-card {
      background-color: rgba(36, 23, 14, 0.85) !important; 
      border: 1px solid rgba(213, 168, 73, 0.4) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); 
    }
    .btn-brand-accent {
      background: linear-gradient(135deg, #ffe29a, #d5a849) !important;
      border-color: #d5a849 !important;
      color: #3e2b19 !important; 
      font-weight: 700 !important;
    }

    .btn-brand-accent:hover {
      background: linear-gradient(135deg, #fff2be, #e3b655) !important;
      color: #24170e !important;
    }
    .brand-link {
      color: #ffe29a !important;
    }
  </style>
</head>
<body class="text-white">

  <div class="d-flex align-items-center h-100">
    <div class="container">
      <div class="row align-items-center justify-content-between g-4">

        <div class="col-12 col-md-6">
          <h1 class="display-4 fw-bold mb-2">Join HostelFinder</h1>
          <p class="fs-3 text-light fw-normal">
            Unlock Doors.<br>
            Unlock Friendships.
          </p>
        </div>
        
        <div class="col-12 col-md-5 col-lg-4">
          <div class="card custom-glass-card text-white shadow-lg rounded-3">
            <div class="card-body p-4">
              <h3 class="card-title fw-bold mb-4 text-center">Create Account</h3>

              <form action="login.html" method="get">
                <div class="mb-3">
                  <label for="signupEmail" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="signupEmail" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                  <label for="signupPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="signupPassword" name="password" placeholder="Create password" required minlength="6">
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Confirm password</label>
                  <input type="password" class="form-control" id="confirmPassword" name="confirm" placeholder="Repeat password" required minlength="6">
                </div>

           
                <button type="submit" class="btn btn-brand-accent w-100 py-2">Create Account</button>
              </form>

              <hr class="my-4 border-secondary">

              <p class="mb-0 text-center text-secondary">
                Already have an account?
                <a href="login.html" class="brand-link text-decoration-none fw-semibold">Log in</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
