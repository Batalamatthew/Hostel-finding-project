<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelFinder - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

  <div class="d-flex align-items-center min-vh-100 py-5">
    <div class="container">
      <div class="row align-items-center justify-content-between g-4">

        <div class="col-12 col-md-6">
          <h1 class="display-4 fw-bold mb-2">Join HostelFinder</h1>
          <p class="fs-3 text-light fw-normal">
            Unlock Doors.<br>
            Unlock Friendships.
          </p>
        </div>

        <div class="col-12 col-md-5 col-lg-4">
          <div class="card bg-dark text-white border-secondary shadow-lg rounded-3">
            <div class="card-body p-4">
              <h3 class="card-title fw-bold mb-4 text-center">Create Account</h3>

              <form action="login.html" method="get">
                <div class="mb-3">
                  <label for="signupEmail" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="signupEmail" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                  <label for="signupPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="signupPassword" name="password" placeholder="Create password" required minlength="6">
                </div>

                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Confirm password</label>
                  <input type="password" class="form-control" id="confirmPassword" name="confirm" placeholder="Repeat password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Create Account</button>
              </form>

              <hr class="my-4 border-secondary">

              <p class="mb-0 text-center text-secondary">
                Already have an account?
                <a href="login.html" class="text-info text-decoration-none fw-semibold">Log in</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
