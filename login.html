<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HostelFinder - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> 
    body {
      min-height: 100vh;
      background: url('low budget hostel.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1rem;
      color: #fff;
    }
    .glass-card .form-control {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 0.4rem;
    }
    .glass-card a { color: #ffd166; font-weight: 600; }

    /* Welcome text on the left */
    .welcome-text {
      font-weight: 700;
      line-height: 1.25;
    }
    .welcome-title {
      display: block;
      color: #fff;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-size: clamp(1.8rem, 4vw, 3rem);
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.75);
    }
    .welcome-sub {
      display: block;
      color: #fff;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      margin-top: 0.5rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="d-flex align-items-center">

  <div class="container">
    <div class="row align-items-center g-4">

      <!-- LEFT: welcome message -->
      <div class="col-12 col-md-6">
        <p class="welcome-text mb-0">
          <span class="welcome-title">Welcome to HostelFinder,</span>
          <span class="welcome-sub">Unlock Doors<br>Unlock Friendships</span>
        </p>
      </div>

      <!-- RIGHT: glass card -->
      <div class="col-11 col-sm-8 col-md-5 col-lg-4 ms-md-auto">

        <div class="glass-card shadow-lg p-4">

          <!-- LOGIN -->
          <form id="loginForm">
            <h3 class="mb-4">Hostel Finder</h3>
            <input type="email" class="form-control mb-3" placeholder="Email" aria-label="Email" required>
            <input type="password" class="form-control mb-4" placeholder="Password" aria-label="Password" required>
            <button type="submit" class="btn btn-light rounded-pill px-4 d-block mx-auto">Continue to Book</button>
            <p class="mt-4 mb-0">
              Don't have an account?<br>
              <a href="#" id="showSignup">Register</a>
            </p>
          </form>

          <!-- SIGN UP -->
          <form id="signupForm" class="d-none">
            <h3 class="mb-4">Create your<br>account</h3>
            <input type="text" class="form-control mb-3" placeholder="Full name" aria-label="Full name" required>
            <input type="email" class="form-control mb-3" placeholder="Email" aria-label="Email" required>
            <input type="password" id="signupPassword" class="form-control mb-3" placeholder="Password" minlength="6" required>
            <input type="password" id="confirmPassword" class="form-control mb-4" placeholder="Confirm password" required>
            <button type="submit" class="btn btn-light rounded-pill px-4 d-block mx-auto">Register</button>
            <p class="mt-4 mb-0">
              Already have an account?<br>
              <a href="#" id="showLogin">Log in</a>
            </p>
          </form>

        </div>
      </div>
    </div>
  </div>
</body><script>
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');

  document.getElementById('showSignup').addEventListener('click', (e) => {
    e.preventDefault();
    loginForm.classList.add('d-none');
    signupForm.classList.remove('d-none');
  });

  document.getElementById('showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    signupForm.classList.add('d-none');
    loginForm.classList.remove('d-none');
  });

  // Login: go to results page
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'hostel_results.html';
  });

  // Register: check passwords match, then show login
  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (pw !== confirm) {
      alert('Passwords do not match');
      return;
    }
    alert('Account created! Please log in.');
    signupForm.classList.add('d-none');
    loginForm.classList.remove('d-none');
  });
</script>
</html>
