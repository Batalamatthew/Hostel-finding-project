
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelFinder - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: url('low budget hostel.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    /* Dark semi-transparent overlay to ensure text readability over background */
    .bg-overlay {
      background-color: rgba(0, 0, 0, 0.55);
      min-height: 100vh;
    }
    .text-shadow {
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="bg-dark text-white">

  <div class="bg-overlay d-flex align-items-center py-5">
    <div class="container">
      <div class="row align-items-center justify-content-between g-4">

        <!-- Left Column: Welcome Heading -->
        <div class="col-12 col-md-6 col-lg-6 text-white text-shadow">
          <h1 class="display-4 fw-bold mb-2">Welcome to HostelFinder</h1>
          <p class="fs-3 text-light fw-normal">
            Unlock Doors.<br>
            Unlock Friendships.
          </p>
        </div>

        <!-- Right Column: Login Card -->
        <div class="col-12 col-md-5 col-lg-4">
          <div class="card bg-dark text-white border-secondary shadow-lg rounded-3">
            <div class="card-body p-4">
              <h3 class="card-title fw-bold mb-4 text-center">Hostel Finder</h3>

              <form action="#" method="POST">
                <div class="mb-3">
                  <label for="userEmail" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="userEmail" name="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-4">
                  <label for="userPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="userPassword" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Continue to Book</button>
              </form>

              <hr class="my-4 border-secondary">

              <div class="text-center">
                <p class="mb-0 text-secondary">
                  Don't have an account? <a href="#" class="text-info text-decoration-none fw-semibold">Register here</a>
                </p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
 
</body><script>
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');

  document.getElementById('showSignup').addEventListener('click', (e) => {
    e.preventDefault();
    loginForm.classList.add('d-none');
    signupForm.classList.remove('d-none');
  });

  document.getElementById('showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    signupForm.classList.add('d-none');
    loginForm.classList.remove('d-none');
  });

  // Login: go to results page
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    window.location.href = 'hostel_results.html';
  });

  // Register: check passwords match, then show login
  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (pw !== confirm) {
      alert('Passwords do not match');
      return;
    }
    alert('Account created! Please log in.');
    signupForm.classList.add('d-none');
    loginForm.classList.remove('d-none');
  });
</script>
</html>
