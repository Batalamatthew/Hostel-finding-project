<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings | HostelFinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar bg-white shadow-sm px-3 px-lg-5">
    <a class="navbar-brand" href="index.html">Hostel<span>Finder</span></a>
    <a class="btn btn-outline-secondary" href="index.html">&larr; Back to Home</a>
  </nav>

  <main class="container py-5" style="max-width: 640px;">
    <h1 class="h3 mb-2">My Bookings</h1>
    <p class="text-muted">Enter the phone number you used when booking to see your hostel bookings.</p>

    <form action="bookings.html" method="get" class="mb-4">
      <label for="phone" class="form-label">Phone number</label>
      <input type="tel" id="phone" name="phone" class="form-control mb-3" placeholder="e.g. 0700 000000" required>
      <button type="submit" class="btn btn-primary">View My Bookings</button>
    </form>

    <section aria-labelledby="list-title">
      <h2 id="list-title" class="h5">Your bookings</h2>
      <p class="text-muted">You have no bookings yet. Find a hostel on the <a href="index.html#hostels">home page</a> and contact the custodian to book.</p>
    </section>
  </main>

</body>
</html>
